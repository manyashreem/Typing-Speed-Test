<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⌨️ Typing Speed Test</h1>
        </header>

        <main>
            <!-- Start Section -->
            <section id="startSection" class="section active">
                <label>Test Duration:</label>
                <select id="duration">
                    <option value="30">30 Seconds</option>
                    <option value="60" selected>1 Minute</option>
                    <option value="120">2 Minutes</option>
                </select>
                <button onclick="startTest()" class="btn primary">Start Test</button>
            </section>

            <!-- Test Section -->
            <section id="testSection" class="section">
                <div class="stats">
                    <div class="stat">
                        <span class="label">Time</span>
                        <span id="timer" class="value">0:00</span>
                    </div>
                    <div class="stat">
                        <span class="label">WPM</span>
                        <span id="wpm" class="value">0</span>
                    </div>
                    <div class="stat">
                        <span class="label">Accuracy</span>
                        <span id="accuracy" class="value">100%</span>
                    </div>
                </div>

                <div class="text-box">
                    <p id="promptText"></p>
                </div>

                <label>Type here:</label>
                <textarea id="typingInput" placeholder="Start typing..."></textarea>

                <div class="buttons">
                    <button onclick="resetTest()" class="btn">Reset</button>
                    <button onclick="endTest()" class="btn danger">Finish</button>
                </div>
            </section>

            <!-- Results Section -->
            <section id="resultsSection" class="section">
                <h2>Results</h2>
                <div class="results">
                    <p>WPM: <strong id="resultWPM">0</strong></p>
                    <p>Accuracy: <strong id="resultAccuracy">0%</strong></p>
                    <p>Time: <strong id="resultTime">0s</strong></p>
                    <p>Characters: <strong id="resultChars">0</strong></p>
                </div>
                <button onclick="startSection()" class="btn primary">Try Again</button>
            </section>

            <div id="error" class="error"></div>
        </main>

        <footer>
            <p>&copy; 2024 Typing Speed Test</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
